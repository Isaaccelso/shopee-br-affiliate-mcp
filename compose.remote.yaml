services:
  shopee-mcp:
    build:
      context: .
      target: remote
    restart: unless-stopped
    command: ["--transport", "oauth-http", "--port", "8765"]
    environment:
      MCP_OWNER_KEY_SHA256: ${MCP_OWNER_KEY_SHA256:-}
      MCP_CREDENTIALS_KEY: ${MCP_CREDENTIALS_KEY:-}
      MCP_STATE_DB: /app/data/oauth.sqlite3
      MCP_PUBLIC_URL: ${MCP_PUBLIC_URL:?Defina a origem HTTPS do servidor}
      MCP_API_KEY: ${MCP_API_KEY:-}
      SHOPEE_APP_ID: ${SHOPEE_APP_ID:-}
      SHOPEE_APP_SECRET: ${SHOPEE_APP_SECRET:-}
      SHOPEE_VERIFIED_PROFILE: /app/examples/profile.official.json
      MCP_OAUTH_REDIRECT_URIS: ${MCP_OAUTH_REDIRECT_URIS:-[]}
      MCP_ALLOW_LOOPBACK_CALLBACKS: ${MCP_ALLOW_LOOPBACK_CALLBACKS:-false}
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - oauth-data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  oauth-data:
